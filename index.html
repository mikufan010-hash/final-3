<title>灭点 Vanish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: drafting table — object tray left, live perspective sheet centre, style + selection right */
:root{
  --film:#e4e9ec; --panel:#f6f8f8; --rule:#cdd5da; --ink:#192126; --mute:#66737b;
  --blue:#2b8ccc; --red:#e0442a; --hi:#ffffff;
  --display:'Archivo','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--film);color:var(--ink);font-family:var(--display);font-size:13px}
button,input,select{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:212px minmax(0,1fr) 276px;grid-template-areas:"bar bar bar" "left stage right"}
#bar{grid-area:bar;display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--rule);background:var(--panel);overflow-x:auto;white-space:nowrap}
.brand{display:flex;align-items:baseline;gap:8px;padding-right:6px}
.brand b{font-size:22px;font-weight:900;letter-spacing:.02em}
.brand span{font-stretch:125%;font-weight:700;font-size:11px;letter-spacing:.32em;color:var(--mute)}
.seg{display:flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;padding:4px 10px;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
.seg button+button{border-left:1px solid var(--ink)}
.seg button svg{width:40px;height:22px;stroke:currentColor;fill:none;stroke-width:1.2}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--hi)}
.seg button:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tog{display:flex;gap:4px}
.chip{border:1px solid var(--rule);background:var(--hi);border-radius:20px;padding:3px 10px;cursor:pointer;font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:#fff}
.rng{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.rng input{width:90px;accent-color:var(--ink)}
.num{font-family:var(--mono);font-size:11px;color:var(--ink);min-width:44px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--ink);background:var(--hi);border-radius:3px;padding:5px 11px;cursor:pointer;font-weight:600}
.btn.dark{background:var(--ink);color:#fff}
.btn.rec{border-color:var(--red);color:var(--red)}
.btn.rec.on{background:var(--red);color:#fff}
.spacer{flex:1}
.drawerbtn{display:none}

aside{background:var(--panel);overflow-y:auto;padding:14px 14px 24px;display:flex;flex-direction:column;gap:18px}
#left{grid-area:left;border-right:1px solid var(--rule)}
#right{grid-area:right;border-left:1px solid var(--rule)}
h3{margin:0;font-size:11px;font-weight:800;font-stretch:115%;letter-spacing:.18em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
h3 small{font-weight:600;letter-spacing:0;text-transform:none;font-stretch:100%;color:var(--mute);font-size:12px}
.sec{display:flex;flex-direction:column;gap:9px}
.tip{color:var(--mute);font-size:11.5px;line-height:1.5;margin:0}
.tray{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ti{border:1px solid var(--rule);background:var(--hi);border-radius:3px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:grab;user-select:none;touch-action:none;font-size:12px}
.ti:hover{border-color:var(--ink)}
.ti svg{width:38px;height:38px;stroke:var(--ink);fill:none;stroke-width:1.3;stroke-linejoin:round}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sw{position:relative;aspect-ratio:1;border:1px solid var(--rule);border-radius:3px;overflow:hidden;cursor:grab;touch-action:none;background:#fff;max-width:100%}
.sw canvas,.sw img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.sw .bd{position:absolute;left:3px;bottom:3px;background:var(--ink);color:#fff;font-size:9px;padding:0 4px;border-radius:2px;font-family:var(--mono)}
.sw.add{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);text-align:center;cursor:pointer;border-style:dashed;line-height:1.3}
.sw:hover{border-color:var(--ink)}

#stage{grid-area:stage;position:relative;overflow:hidden;min-width:0}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none;cursor:crosshair}
#grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.1}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(25,33,38,.82);color:#e9eef0;font-size:11.5px;padding:5px 12px;border-radius:20px;pointer-events:none;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 14px;border-radius:3px;font-size:12px;pointer-events:none;transition:opacity .3s;opacity:0}
#toast.on{opacity:1}

#comm{position:absolute;left:14px;top:14px;width:250px;background:#fffef9;border:1px solid var(--ink);padding:10px 12px 10px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-1deg)}
#comm .hd{display:flex;justify-content:space-between;font-size:10.5px;font-family:var(--mono);color:var(--mute);letter-spacing:.05em}
#comm p{margin:6px 0 8px;font-size:13.5px;line-height:1.45;font-weight:600;text-wrap:balance}
#comm .ft{display:flex;justify-content:space-between;align-items:center}
#comm .ft button{background:none;border:0;padding:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:11.5px}
#comm .stamps{font-family:var(--mono);font-size:11px}
#comm .stamp{position:absolute;right:10px;top:16px;border:3px solid var(--red);color:var(--red);font-weight:900;font-size:22px;padding:2px 10px;transform:rotate(-14deg) scale(1.6);opacity:0;transition:all .25s cubic-bezier(.2,1.6,.4,1);letter-spacing:.1em}
#comm.done .stamp{opacity:.92;transform:rotate(-14deg) scale(1)}
#comm.min p,#comm.min .ft{display:none}
#comm .hd button{background:none;border:0;cursor:pointer;color:var(--mute);font-family:var(--mono);padding:0 0 0 6px}

.styles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.st{border:1px solid var(--rule);border-radius:3px;background:var(--hi);padding:6px 7px;text-align:left;cursor:pointer;display:flex;gap:7px;align-items:center;font-weight:600}
.st i{display:block;width:22px;height:22px;border-radius:2px;flex:none;border:1px solid rgba(0,0,0,.15)}
.st small{display:block;font-weight:500;color:var(--mute);font-size:10px;letter-spacing:.06em}
.st[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.st[disabled]{opacity:.45;cursor:not-allowed}
.row{display:grid;grid-template-columns:56px 1fr 40px;align-items:center;gap:6px;font-size:12px}
.row input[type=range]{width:100%;accent-color:var(--ink);min-width:0}
.row .num{text-align:right;min-width:0}
.handcode{display:flex;gap:6px;align-items:center}
.handcode input{flex:1;min-width:0;font-family:var(--mono);font-size:12px;border:1px solid var(--rule);border-radius:3px;padding:4px 6px;background:#fff;letter-spacing:.06em}
.dice{display:flex;align-items:center;gap:6px}
.dice svg{width:16px;height:16px}
.segs{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.segs button{flex:1;border:0;background:#fff;padding:4px 0;cursor:pointer;font-size:12px}
.segs button+button{border-left:1px solid var(--rule)}
.segs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns .btn{font-size:12px;padding:4px 9px}
.selname{font-family:var(--mono);font-size:12px}
.colorrow{display:flex;align-items:center;gap:8px;font-size:12px}
.colorrow input[type=color]{width:34px;height:24px;border:1px solid var(--rule);padding:0;background:none}

#modal{position:fixed;inset:0;background:rgba(18,24,28,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal .sheet{background:var(--panel);max-width:min(900px,100%);max-height:100%;overflow:auto;border:1px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:10px}
#modal header{display:flex;justify-content:space-between;align-items:center;gap:10px}
#modal img,#modal video{max-width:100%;max-height:70vh;display:block;border:1px solid var(--rule);background:#fff}
#modal .note{margin:0;color:var(--mute);font-size:12px}
#modal a{color:var(--blue)}
.ghost{position:fixed;width:54px;height:54px;pointer-events:none;z-index:20;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:translate(-50%,-50%) rotate(-4deg);background:#fff;overflow:hidden}
.ghost canvas,.ghost img{width:100%;height:100%;object-fit:cover}
#fail{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--film);font-size:15px;padding:16px}

@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"bar" "stage"}
  #left,#right{position:fixed;top:56px;bottom:0;width:min(280px,86vw);z-index:5;box-shadow:0 0 0 1px var(--rule),8px 0 30px rgba(0,0,0,.15)}
  #left{left:0;transform:translateX(-105%);transition:transform .2s}
  #right{right:0;transform:translateX(105%);transition:transform .2s}
  #left.open,#right.open{transform:none}
  .drawerbtn{display:inline-block}
  #comm{width:200px}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header id="bar">
    <button class="btn drawerbtn" id="openL">物件</button>
    <div class="brand"><b>灭点</b><span>VANISH</span></div>
    <div class="seg" role="group" aria-label="透视类型">
      <button id="m1" aria-pressed="false" title="一点透视 (1)"><svg viewBox="0 0 40 22"><path d="M0 9h40"/><path d="M20 9 4 21M20 9l16 12M20 9 9 0M20 9l11-9" opacity=".45"/><rect x="13" y="6" width="14" height="8"/></svg>一点</button>
      <button id="m2" aria-pressed="true" title="两点透视 (2)"><svg viewBox="0 0 40 22"><path d="M0 7h40"/><path d="M2 7 20 4M2 7l18 15M38 7 20 4M38 7 20 22" opacity=".45"/><path d="M20 4v18"/></svg>两点</button>
      <button id="m3" aria-pressed="false" title="三点透视 (3)"><svg viewBox="0 0 40 22"><path d="M0 4h40"/><path d="M2 4l14 4M38 4l-14 4M16 8l4 14M24 8l-4 14" opacity=".55"/><circle cx="20" cy="21" r="1.4"/></svg>三点</button>
    </div>
    <label class="rng" id="lensWrap" title="一点透视的焦距">焦距 <input type="range" id="lens" min="0.3" max="2.6" step="0.01" value="0.9"><span class="num" id="lensV"></span></label>
    <span class="rng" id="fovWrap">视角 <span class="num" id="fovV"></span></span>
    <label class="rng" title="视高：眼睛离地多高">视高 <input type="range" id="eye" min="0.2" max="12" step="0.05" value="1.6"><span class="num" id="eyeV"></span></label>
    <div class="tog">
      <button class="chip" id="tGuide" aria-pressed="true" title="G">辅助线</button>
      <button class="chip" id="tGrid" aria-pressed="true">地面网格</button>
      <button class="chip" id="tRays" aria-pressed="false">放射线</button>
      <button class="chip" id="tCons" aria-pressed="false">全部构造线</button>
      <button class="chip" id="tShadow" aria-pressed="true">投影</button>
      <button class="chip" id="tDrift" aria-pressed="false" title="空格">漂移</button>
      <button class="chip" id="tBoil" aria-pressed="false">抖线</button>
    </div>
    <span class="spacer"></span>
    <button class="btn dark" id="bPng">导出图片</button>
    <button class="btn rec" id="bRec">● 录制</button>
    <button class="btn" id="bGlb">导出 GLB</button>
    <button class="btn drawerbtn" id="openR">风格</button>
  </header>

  <aside id="left">
    <section class="sec">
      <h3>物件 <small>拖进画面</small></h3>
      <div class="tray" id="tray"></div>
    </section>
    <section class="sec">
      <h3>贴图 <small>拖到某一面</small></h3>
      <div class="swatches" id="swatches"></div>
      <p class="tip">拖到物体的某一面＝只贴那一面；按住 Shift 放下＝贴满整个物体。拖到地面或天空也可以。电脑里的图片、视频可直接拖进画面。</p>
    </section>
    <section class="sec">
      <h3>3D 模型</h3>
      <button class="btn" id="bModel">导入 .glb / .obj</button>
      <p class="tip">模型会对齐到当前的透视轴，可以像方块一样拖动和贴图。</p>
    </section>
  </aside>

  <main id="stage">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div id="grain"></div>
    <div id="comm">
      <div class="hd"><span id="commNo">委托 №01</span><span><span class="stamps" id="stampN">章 0</span><button id="commMin" title="收起">–</button></span></div>
      <p id="commText"></p>
      <div class="ft"><button id="commSkip">换一张</button><span class="tip" id="commReward"></span></div>
      <div class="stamp">完成</div>
    </div>
    <div id="toast"></div>
    <div id="hint">拖红点改灭点 · 拖横线移视平线 · 拖物体移动，甩一下会滑向远方 · Shift+拖 升降 · 滚轮 缩放 · Alt+滚轮 旋转</div>
  </main>

  <aside id="right">
    <section class="sec">
      <h3>风格 <small>画材</small></h3>
      <div class="styles" id="styles"></div>
    </section>
    <section class="sec">
      <h3>手 <small>你的笔性</small></h3>
      <div id="handRows"></div>
      <div class="handcode">
        <button class="btn dice" id="bDice" title="掷出一只新的手"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="1.5" width="13" height="13" rx="2"/><circle cx="5" cy="5" r="1" fill="currentColor"/><circle cx="11" cy="11" r="1" fill="currentColor"/><circle cx="8" cy="8" r="1" fill="currentColor"/></svg>掷手</button>
        <input id="handCode" aria-label="手签代码" spellcheck="false" title="把别人的手签贴进来，回车">
      </div>
      <p class="tip">手签记录风格和全部笔性。发给朋友，他就能用你的手画画。</p>
    </section>
    <section class="sec" id="selSec">
      <h3>选中 <small id="selTag"></small></h3>
      <div id="selBody"></div>
    </section>
  </aside>
</div>

<div id="modal" hidden><div class="sheet">
  <header><b id="mTitle"></b><button class="btn" id="mClose">关闭</button></header>
  <div id="mBody"></div>
  <p class="note" id="mNote"></p>
</div></div>
<input type="file" id="fTex" accept="image/*,video/*" multiple hidden>
<input type="file" id="fModel" accept=".glb,.gltf,.obj" hidden>
<div id="fail" hidden>3D 引擎没有加载成功。请检查网络后刷新页面。</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/OBJLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/lines/LineMaterial.js"></script>

<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('fail').hidden=false;return;}
const T=THREE;
const hasLine2=!!(T.LineSegments2&&T.LineMaterial&&T.LineSegmentsGeometry);
const $=s=>document.querySelector(s);

/* ---------- small helpers ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];

let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
const store={get(k,d){try{const v=localStorage.getItem('vanish.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('vanish.'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- styles (画材) ---------- */
const STYLES=[
 {id:'draft',name:'制图',en:'DRAFTING',sky:'#eef2f4',ground:'#e5ebee',grid:'#79b2d6',gridA:.55,ink:'#1d252b',pal:['#ffffff','#f0f3f5','#dde5ea','#c9d6de'],toon:3,shA:.13,shC:'#24323b',fog:true,edges:true,lw:1.3,lineA:.92,cons:'#2b8ccc',
  hand:{jit:.12,str:2,over:.55,wt:1,cons:.35,grain:.12}},
 {id:'charcoal',name:'炭笔',en:'CHARCOAL',sky:'#d7d8d5',ground:'#cacbc7',grid:'#8d8f8b',gridA:.35,ink:'#151515',pal:['#efefec','#c4c4c0','#9a9a96'],toon:3,shA:.32,shC:'#111',fog:true,edges:true,lw:1.6,lineA:.82,cons:'#1a1a1a',
  hand:{jit:.5,str:3,over:.85,wt:1.5,cons:.45,grain:.45}},
 {id:'poster',name:'平涂',en:'POSTER',sky:'#f2bf35',ground:'#e3562f',grid:'#b9401d',gridA:0,ink:'#141414',pal:['#1e3f8f','#f7f4ef','#0e9c8a','#ff8db0','#262626'],toon:2,shA:.42,shC:'#2a0d05',fog:false,edges:false,lw:1,lineA:1,cons:'#141414',

 {id:'cyan',name:'蓝晒',en:'CYANOTYPE',sky:'#1c4f8a',ground:'#174579',grid:'#6496cc',gridA:.45,ink:'#eef5fb',pal:['#e3eef8','#a8c8e6','#6e9cd0'],toon:3,shA:.3,shC:'#06203d',fog:true,edges:true,lw:1.1,lineA:.9,cons:'#cfe3f5',
  hand:{jit:.15,str:2,over:.4,wt:1.1,cons:.3,grain:.35}},
 {id:'riso',name:'孔版',en:'RISO',sky:'#f6f6f3',ground:'#f6f6f3',grid:'#ff48b0',gridA:.28,ink:'#0078bf',pal:['#ff48b0','#0078bf','#ffe800','#00a95c'],toon:2,shA:.55,shC:'#0078bf',fog:false,edges:true,lw:1.3,lineA:.9,cons:'#ff48b0',
  hand:{jit:.25,str:2,over:.3,wt:1.3,cons:.0,grain:.55}},
 {id:'wire',name:'线框',en:'HIDDEN LINE',sky:'#0c0f16',ground:'#0c0f16',grid:'#25324c',gridA:.8,ink:'#7df9ff',pal:['#7df9ff','#ff5ec4','#c6ff4a','#ffb347'],toon:1,shA:0,shC:'#000',fog:true,edges:true,lw:1.2,lineA:1,cons:'#7df9ff',basic:true,neon:true,
  hand:{jit:.05,str:1,over:.2,wt:1.2,cons:.2,grain:.05}},
 {id:'dream',name:'梦',en:'NORMAL MAP',sky:'#e9e4f7',ground:'#dde6f4',grid:'#9d8fd6',gridA:.4,ink:'#3b2f6b',pal:['#ffffff'],toon:3,shA:.18,shC:'#3b2f6b',fog:true,edges:true,lw:1,lineA:.8,cons:'#6c5bd0',normal:true,lock:3,
  hand:{jit:.3,str:2,over:.3,wt:1,cons:.15,grain:.2}}
];
const SD=id=>STYLES.find(s=>s.id===id);

/* ---------- camera from vanishing points ---------- */
function ortho(a,b,c){const a1=b.x-c.x,b1=b.y-c.y,r1=a.x*a1+a.y*b1,a2=a.x-c.x,b2=a.y-c.y,r2=b.x*a2+b.y*b2,det=a1*b2-a2*b1;if(Math.abs(det)<1e-9)return null;return{x:(r1*b2-r2*b1)/det,y:(a1*r2-a2*r1)/det}}
function computeCam(mode,v){
  let c,f,ax,ay,az;
  if(mode===1){c={x:v[0].x,y:v[0].y};f=S.lensF;ax=[1,0,0];ay=[0,-1,0];az=[0,0,1]}
  else if(mode===2){
    const v1=v[0],v2=v[1],dx=v2.x-v1.x,dy=v2.y-v1.y,L2=dx*dx+dy*dy;if(L2<900)return null;
    let t=((W/2-v1.x)*dx+(H/2-v1.y)*dy)/L2;t=clamp(t,.15,.85);
    c={x:v1.x+dx*t,y:v1.y+dy*t};f=Math.sqrt(t*(1-t)*L2);
    const d1=norm([v1.x-c.x,v1.y-c.y,f]),d2=norm([v2.x-c.x,v2.y-c.y,f]);
    let up=norm(cross(d1,d2));if(up[1]>0)up=neg(up);ax=d1;az=d2;ay=up;
  } else {
    const[v1,v2,v3]=v;c=ortho(v1,v2,v3);if(!c)return null;
    const p=(a,b)=>(a.x-c.x)*(b.x-c.x)+(a.y-c.y)*(b.y-c.y);
    const f2=-p(v1,v2);if(f2<=4||-p(v1,v3)<=4||-p(v2,v3)<=4)return null;
    f=Math.sqrt(f2);
    const d1=norm([v1.x-c.x,v1.y-c.y,f]),d2=norm([v2.x-c.x,v2.y-c.y,f]),d3=norm([v3.x-c.x,v3.y-c.y,f]);
    ax=d1;az=d2;ay=d3[1]<0?d3:neg(d3);
  }
  if(dot(ax,cross(ay,az))<0)ax=neg(ax);
  return{c,f,ax,ay,az,E:[0,S.eyeH,0]};
}
function toCam(K,p){const q=sub(p,K.E);return[K.ax[0]*q[0]+K.ay[0]*q[1]+K.az[0]*q[2],K.ax[1]*q[0]+K.ay[1]*q[1]+K.az[1]*q[2],K.ax[2]*q[0]+K.ay[2]*q[1]+K.az[2]*q[2]]}
function project(p,K=CAM){const c=toCam(K,p);if(c[2]<.03)return null;return{x:K.c.x+K.f*c[0]/c[2],y:K.c.y+K.f*c[1]/c[2],z:c[2]}}
function dirVP(dw,K=CAM){const dc=[K.ax[0]*dw[0]+K.ay[0]*dw[1]+K.az[0]*dw[2],K.ax[1]*dw[0]+K.ay[1]*dw[1]+K.az[1]*dw[2],K.ax[2]*dw[0]+K.ay[2]*dw[1]+K.az[2]*dw[2]];
  if(Math.abs(dc[2])<1e-5){const l=Math.hypot(dc[0],dc[1])||1;return{inf:true,dx:dc[0]/l,dy:dc[1]/l}}
  return{x:K.c.x+K.f*dc[0]/dc[2],y:K.c.y+K.f*dc[1]/dc[2]}}
function ray(mx,my,K=CAM){const d=[(mx-K.c.x)/K.f,(my-K.c.y)/K.f,1];return[dot(K.ax,d),dot(K.ay,d),dot(K.az,d)]}
function rayY(mx,my,y,K=CAM){if(!K)return null;const d=ray(mx,my,K);if(Math.abs(d[1])<1e-7)return null;const t=(y-K.E[1])/d[1];if(t<=0||t>4000)return null;return[K.E[0]+d[0]*t,y,K.E[2]+d[2]*t]}
function horizFrame(K){let F=[K.ax[2],0,K.az[2]];const l=Math.hypot(F[0],F[2]);if(l<1e-4)F=[0,0,1];else F=[F[0]/l,0,F[2]/l];return{F,R:[-F[2],0,F[0]]}}
function applyCamera(){
  const{ax,ay,az,E,c,f}=CAM;
  const R=[[ax[0],ay[0],az[0]],[-ax[1],-ay[1],-az[1]],[-ax[2],-ay[2],-az[2]]];
  const t=R.map(r=>-(r[0]*E[0]+r[1]*E[1]+r[2]*E[2]));
  camera.matrixWorldInverse.set(R[0][0],R[0][1],R[0][2],t[0],R[1][0],R[1][1],R[1][2],t[1],R[2][0],R[2][1],R[2][2],t[2],0,0,0,1);
  camera.matrixWorld.copy(camera.matrixWorldInverse).invert();camera.matrix.copy(camera.matrixWorld);
  camera.matrix.decompose(camera.position,camera.quaternion,camera.scale);
  const n=.05,fa=7000;
  camera.projectionMatrix.set(2*f/W,0,1-2*c.x/W,0, 0,2*f/H,2*c.y/H-1,0, 0,0,-(fa+n)/(fa-n),-2*fa*n/(fa-n), 0,0,-1,0);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  const{F}=horizFrame(CAM);
  const gx=Math.round(F[0]*45),gz=Math.round(F[2]*45);
  if(grid)grid.position.set(gx,.002,gz);
  ground.position.set(gx,0,gz);shadowPlane.position.set(gx,.001,gz);
  updateTopbar();
}
function setVPs(nv,mode=S.mode,anchor=true){
  const old=CAM,pm=S.mode;S.mode=mode;
  const cand=computeCam(mode,nv);
  if(!cand){S.mode=pm;return false}
  let rel=null;
  if(anchor&&old){const{F,R}=horizFrame(old);rel=S.objs.map(o=>[o.x*F[0]+o.z*F[2],o.x*R[0]+o.z*R[2]])}
  S.vps=nv.map(p=>({x:p.x,y:p.y}));CAM=cand;
  if(rel){const{F,R}=horizFrame(CAM);S.objs.forEach((o,i)=>{o.x=F[0]*rel[i][0]+R[0]*rel[i][1];o.z=F[2]*rel[i][0]+R[2]*rel[i][1];if(o.vel){const v=o.vel;o.vel=null;o.vel=v}place(o)})}
  applyCamera();return true;
}
function horizonY(){return S.mode===1?S.vps[0].y:(S.vps[0].y+S.vps[1].y)/2}
function setMode(m){
  const hy=clamp(horizonY(),H*.05,H*.95);
  let nv;
  if(m===1)nv=[{x:W*.5,y:hy}];
  else if(m===2)nv=[{x:W*.06,y:hy},{x:W*.94,y:hy}];
  else{const up=hy>H*.55;nv=[{x:W*.06,y:hy},{x:W*.94,y:hy},{x:W*.5,y:up?hy-H*1.3:hy+H*1.3}]}
  if(!S.lensF)S.lensF=Math.max(W,H)*.9;
  if(!setVPs(nv,m)){toast('这个视平线位置放不下三点透视');return}
  ['m1','m2','m3'].forEach((id,i)=>$('#'+id).setAttribute('aria-pressed',String(i+1===m)));
}
function updateTopbar(){
  $('#lensWrap').style.display=S.mode===1?'':'none';
  if(CAM){const fov=2*Math.atan(W/2/CAM.f)*180/Math.PI;$('#fovV').textContent=fov.toFixed(0)+'°'}
  $('#lensV').textContent=(S.lensF/Math.max(W,H)).toFixed(2);
  $('#eyeV').textContent=S.eyeH.toFixed(2)+'m';
}

function computeStyle(){

}
function makeGrad(n){
  const vals=n<=1?[255]:n===2?[120,255]:n===3?[80,165,255]:[60,120,190,255];
  const d=new Uint8Array(vals.length*4);vals.forEach((v,i)=>{d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255});
  const t=new T.DataTexture(d,vals.length,1,T.RGBAFormat);t.minFilter=t.magFilter=T.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t;
}
function applyStyle(rebuild=true){

  if(GRAD)GRAD.dispose();GRAD=makeGrad(st.toon);
  applySky();
  scene.fog=st.fog?new T.Fog(st.sky,40,260):null;
  if(!S.groundTex){groundMat.map=null;groundMat.color.set(st.ground)}groundMat.needsUpdate=true;
  shadowMat.color.set(st.shC);shadowMat.opacity=S.shadow?st.shA:0;
  hullMat.color.set(st.ink);

  grid=new T.GridHelper(140,140,st.grid,st.grid);grid.material.transparent=true;grid.material.opacity=st.gridA;grid.material.depthWrite=false;grid.visible=S.grid&&st.gridA>0;scene.add(grid);
  const a=S.hand.sun*Math.PI*2;sunDir=[Math.cos(a)*.8,1.1,Math.sin(a)*.8];
  const g=$('#grain');g.style.opacity=String(S.hand.grain*.55);g.style.mixBlendMode=isDark(st.sky)?'screen':'multiply';
  if(CAM)applyCamera();
  if(rebuild)S.objs.forEach(o=>rebuildObj(o));
  renderStyleChips();renderHand();
}

const TEX=new Map();let TID=1;
function addTex({name,kind,canvas,img,video,url}){
  const id=TID++;let tex,aspect=1,thumb;
  if(kind==='video'){tex=new T.VideoTexture(video);aspect=(video.videoWidth||16)/(video.videoHeight||9)}
  else if(canvas){tex=new T.CanvasTexture(canvas);aspect=canvas.width/canvas.height}
  else{tex=new T.Texture(img);tex.needsUpdate=true;aspect=img.naturalWidth/img.naturalHeight}
  tex.encoding=T.sRGBEncoding;tex.anisotropy=MAXANI;tex.wrapS=tex.wrapT=T.RepeatWrapping;
  const tc=document.createElement('canvas');tc.width=tc.height=120;
  const drawThumb=()=>{const g=tc.getContext('2d'),src=canvas||img||video;const sw=src.videoWidth||src.naturalWidth||src.width,sh=src.videoHeight||src.naturalHeight||src.height;if(!sw)return;const s=Math.min(sw,sh);g.drawImage(src,(sw-s)/2,(sh-s)/2,s,s,0,0,120,120)};
  drawThumb();if(video){video.addEventListener('loadeddata',drawThumb,{once:true})}
  const rec={id,name,kind,tex,aspect,thumb:tc,video};TEX.set(id,rec);
  const el=document.createElement('div');el.className='sw';el.title=name;el.appendChild(tc);
  if(kind==='video'){const b=document.createElement('span');b.className='bd';b.textContent='视频';el.appendChild(b)}
  el.addEventListener('pointerdown',e=>startTexDrag(e,id));
  $('#swatches').insertBefore(el,$('#swAdd'));
  return id;
}
function procTextures(){
  const R=Math.random,mk=(name,fn)=>{const c=document.createElement('canvas');c.width=c.height=512;fn(c.getContext('2d'),512);addTex({name,kind:'proc',canvas:c})};
  const hsl=(h,s,l)=>`hsl(${h},${s}%,${l}%)`;
  mk('砖墙',(g,n)=>{const h=8+R()*25;g.fillStyle=hsl(h,15,78);g.fillRect(0,0,n,n);const rh=n/8;for(let r=0;r<8;r++){const off=r%2?64:0;for(let x=-128;x<n;x+=128){g.fillStyle=hsl(h+R()*10,40+R()*20,38+R()*14);g.fillRect(x+off+4,r*rh+4,120,rh-8)}}});
  mk('棋格',(g,n)=>{const a=R()<.5?['#111','#f4f4f4']:[hsl(R()*360,60,45),'#f2f2f2'];const k=8;for(let y=0;y<k;y++)for(let x=0;x<k;x++){g.fillStyle=a[(x+y)%2];g.fillRect(x*n/k,y*n/k,n/k,n/k)}});
  mk('斜纹',(g,n)=>{const h=R()*360,c=[hsl(h,70,62),hsl(h+120,60,80),hsl(h+200,55,35)];g.translate(n/2,n/2);g.rotate(Math.PI/4);for(let i=-24;i<24;i++){g.fillStyle=c[(i+24)%3];g.fillRect(i*32,-n,32,n*2)}});
  mk('晚霞',(g,n)=>{const h=R()*60-20;const gr=g.createLinearGradient(0,0,0,n);gr.addColorStop(0,hsl(h+230,55,30));gr.addColorStop(.55,hsl(h+20,85,62));gr.addColorStop(1,hsl(h+45,95,78));g.fillStyle=gr;g.fillRect(0,0,n,n);g.fillStyle=hsl(h+40,100,90);g.beginPath();g.arc(n*(.3+R()*.4),n*.62,n*.16,0,7);g.fill();g.fillStyle=hsl(h+230,45,22);for(let i=0;i<6;i++)g.fillRect(0,n*.66+i*i*6,n,2+i*1.5)});
  mk('网点',(g,n)=>{const h=R()*360;g.fillStyle='#f5f5f2';g.fillRect(0,0,n,n);g.fillStyle=hsl(h,70,40);for(let y=0;y<n;y+=16)for(let x=0;x<n;x+=16){const r=7*(x+y)/(2*n)+.6;g.beginPath();g.arc(x+8,y+8,r,0,7);g.fill()}});
  mk('水磨石',(g,n)=>{const h=R()*360;g.fillStyle=hsl(h,18,88);g.fillRect(0,0,n,n);for(let i=0;i<260;i++){g.fillStyle=hsl(h+R()*120-60,30+R()*50,30+R()*50);g.beginPath();const x=R()*n,y=R()*n,s=3+R()*12;g.moveTo(x,y);for(let k=0;k<5;k++)g.lineTo(x+(R()-.5)*s*2,y+(R()-.5)*s*2);g.fill()}});
  mk('字',(g,n)=>{const h=R()*360;g.fillStyle=hsl(h,65,55);g.fillRect(0,0,n,n);g.fillStyle='#111';g.font='900 150px Archivo, sans-serif';g.textBaseline='top';const w=['灭点','VAN','ISH','透视'];for(let i=0;i<4;i++)g.fillText(w[(i+((R()*4)|0))%4],-10+(i%2)*40,i*128-8)});
  mk('木纹',(g,n)=>{const h=25+R()*15;g.fillStyle=hsl(h,45,62);g.fillRect(0,0,n,n);g.strokeStyle=hsl(h,45,38);for(let i=0;i<40;i++){g.lineWidth=.6+R()*2;g.beginPath();const y0=i*14+R()*6;for(let x=0;x<=n;x+=8)g.lineTo(x,y0+Math.sin(x*.012+i*.7)*9+Math.sin(x*.05)*2);g.stroke()}});
  mk('坐标纸',(g,n)=>{g.fillStyle='#fbfcfd';g.fillRect(0,0,n,n);for(let i=0;i<=n;i+=16){g.strokeStyle=i%64?'rgba(43,140,204,.35)':'rgba(43,140,204,.85)';g.lineWidth=i%64?1:1.6;g.beginPath();g.moveTo(i,0);g.lineTo(i,n);g.moveTo(0,i);g.lineTo(n,i);g.stroke()}});
}
function texFromFile(file){return new Promise(res=>{
  const url=URL.createObjectURL(file);
  if(file.type.startsWith('video')){const v=document.createElement('video');v.src=url;v.muted=true;v.loop=true;v.playsInline=true;v.crossOrigin='anonymous';
    v.addEventListener('loadedmetadata',()=>{v.play().catch(()=>{});const id=addTex({name:file.name,kind:'video',video:v});TEX.get(id).aspect=v.videoWidth/v.videoHeight;res(id)},{once:true});v.addEventListener('error',()=>{toast('这个视频格式读不了');res(null)},{once:true})}
  else{const im=new Image();im.onload=()=>res(addTex({name:file.name,kind:'image',img:im}));im.onerror=()=>{toast('这张图读不了');res(null)};im.src=url}

function duplicate(o){

/* ---------- models ---------- */
async function loadModel(file,mx,my){
  const n=file.name.toLowerCase();
  const done=(root,keep)=>{
    const wrap=new T.Group();wrap.add(root);wrap.updateMatrixWorld(true);
    const box=new T.Box3().setFromObject(wrap),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());
    if(!isFinite(size.x)||size.length()<1e-6){toast('模型是空的');return}
    size.x=Math.max(size.x,1e-3);size.y=Math.max(size.y,1e-3);size.z=Math.max(size.z,1e-3);
    const s=1.5/Math.max(size.x,size.y,size.z);
    const o=newObj('model',{name:file.name.replace(/\.[^.]+$/,'').slice(0,14),tmpl:wrap,size,center,min:box.min.clone(),keepMat:keep,w:size.x*s,h:size.y*s,d:size.z*s});
    const p=(mx!=null&&rayY(mx,my,0))||rayY(W*.5,H*.8,0)||[0,0,5];o.x=p[0];o.z=p[2];addObj(o);select(o);C.imported=true;
    if(!o.segs)toast('模型面数较多，已关闭它的线稿');
  };
  try{
    if(n.endsWith('.obj')){if(!T.OBJLoader)throw new Error('OBJ 读取器未加载');done(new T.OBJLoader().parse(await file.text()),false)}
    else{if(!T.GLTFLoader)throw new Error('GLB 读取器未加载');const buf=await file.arrayBuffer();new T.GLTFLoader().parse(buf,'',g=>done(g.scene,true),err=>toast('模型读取失败：'+(err.message||err)))}
  }catch(err){toast('模型读取失败：'+err.message)}
}

function updateStamps(){$('#stampN').textContent='章 '+C.stamps;const next=STYLES.find(s=>s.lock&&C.stamps<s.lock);$('#commReward').textContent=next?`再盖 ${next.lock-C.stamps} 个章解锁新画材`:''}
setInterval(()=>{if(!card||card.done)return;let ok=false;try{ok=COMMS[card.i].ok(card)}catch(e){}
  if(ok){card.done=true;C.stamps++;store.set('stamps',C.stamps);$('#comm').classList.add('done');updateStamps();renderStyleChips();
    const un=STYLES.find(s=>s.lock===C.stamps);if(un)toast('解锁了新画材：'+un.name);setTimeout(newCard,1900)}},400);
$('#commSkip').onclick=newCard;
$('#commMin').onclick=()=>{$('#comm').classList.toggle('min');$('#commMin').textContent=$('#comm').classList.contains('min')?'+':'–'};

/* ---------- loop ---------- */
let last=performance.now(),boilT=0,driftT=0,shT=0;
function render(){if(CAM)renderer.render(scene,camera);drawOverlay(octx,false)}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S.drift&&!(S.drag&&(S.drag.k==='vp'||S.drag.k==='hor'))){driftT+=dt;const t=driftT,v=S.vps.map(p=>({x:p.x,y:p.y}));
    const dy=Math.cos(t*.37)*.37*H*.05*dt,a=Math.cos(t*.23)*.23*W*.09*dt,b=Math.cos(t*.31+1)*.31*W*.09*dt,c=Math.cos(t*.19)*.19*H*.12*dt;
    if(S.mode===1){v[0].x+=a;v[0].y+=dy}else{v[0].x+=a;v[1].x+=b;v[0].y+=dy;v[1].y+=dy;if(S.mode===3){v[2].x+=a*.5;v[2].y+=c}}setVPs(v)}
  if((S.boil||S.drift)&&now-boilT>130){boilT=now;S.tick++;S.objs.forEach(o=>genLines(o,S.tick))}
  for(const o of S.objs){
    if(S.drag&&S.drag.o===o)continue;
    let moved=false;
    if(o.vel){o.x+=o.vel[0]*dt;o.z+=o.vel[1]*dt;const k=Math.exp(-1.5*dt);o.vel[0]*=k;o.vel[1]*=k;moved=true;if(Math.hypot(o.vel[0],o.vel[1])<.05||Math.hypot(o.x,o.z)>900)o.vel=null}
    if(!o.float){const sy=supportY(o,o.x,o.z);if(o.y>sy+1e-3){o.vy-=9.8*dt;o.y=Math.max(sy,o.y+o.vy*dt);if(o.y===sy)o.vy=0;moved=true}else if(o.y<sy-1e-3&&o.vel){o.y=sy;moved=true}}
    if(moved){place(o);if(o===S.sel)syncSelVals()}
  }
  if(now-shT>300&&S.objs.length){shT=now;let cx=0,cz=0;S.objs.forEach(o=>{cx+=o.x;cz+=o.z});cx/=S.objs.length;cz/=S.objs.length;sun.target.position.set(cx,0,cz);sun.position.set(cx+sunDir[0]*40,sunDir[1]*40,cz+sunDir[2]*40);sun.target.updateMatrixWorld()}
  if(hasLine2)S.objs.forEach(o=>{if(o.lmat&&o.lmat.resolution)o.lmat.resolution.set(W,H)});
  render();
  if(rec){composite();const left=8-(now-rec.t0)/1000;$('#bRec').textContent='■ 停止 '+Math.max(0,left).toFixed(0)+'s';if(left<=0)rec.stop()}
  requestAnimationFrame(frame);
}

/* ---------- resize ---------- */
function resize(){
  const r=stage.getBoundingClientRect(),nw=Math.max(200,r.width),nh=Math.max(200,r.height);
  const sx=nw/W,sy=nh/H,first=!CAM;W=nw;H=nh;DPR=Math.min(2,window.devicePixelRatio||1);
  renderer.setPixelRatio(DPR);renderer.setSize(W,H,false);ov.width=W*DPR;ov.height=H*DPR;octx.setTransform(DPR,0,0,DPR,0,0);
  if(first)return;S.vps=S.vps.map(p=>({x:p.x*sx,y:p.y*sy}));S.lensF*=Math.max(sx,sy);setVPs(S.vps,S.mode,false);
}
new ResizeObserver(()=>resize()).observe(stage);

/* ---------- boot ---------- */
function boot(){
  resize();
  buildTray();procTextures();computeStyle();applyStyle(false);
  S.lensF=Math.max(W,H)*.9;
  const hy=H*.4;S.vps=[{x:W*.06,y:hy},{x:W*.94,y:hy},{x:W*.5,y:hy+H*1.3}];
  setVPs(S.vps,2,false);
  const at=(fx,fy)=>rayY(W*fx,H*fy,0)||[0,0,6];
  const ids=[...TEX.keys()];const tid=n=>ids.find(i=>TEX.get(i).name===n);
  const put=(type,fx,fy,ex)=>{const o=newObj(type,ex);const p=at(fx,fy);o.x=p[0];o.z=p[2];addObj(o);if(!o.float)o.y=supportY(o,o.x,o.z);place(o);return o};
  put('slab',.46,.78,{w:3,d:2.4});
  const tw=put('box',.46,.76,{w:.9,h:2.6,d:.9,allTex:tid('砖墙'),map:'tile'});tw.y=.18;place(tw);
  put('column',.68,.7,{allTex:tid('斜纹'),map:'collage'});
  const st=put('stairs',.27,.88,{});st.faces={'4:4':tid('棋格'),'4:0':tid('棋格')};rebuildObj(st);
  put('panel',.78,.88,{allTex:tid('晚霞'),map:'fit',w:1.5,h:1});
  put('orb',.6,.93,{allTex:tid('水磨石'),map:'fit',w:.7,h:.7,d:.7});
  put('gate',.2,.66,{allTex:tid('字'),map:'collage'});
  renderSel();newCard();requestAnimationFrame(frame);
}
boot();
})();
</script>
